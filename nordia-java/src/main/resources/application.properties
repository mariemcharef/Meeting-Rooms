spring.application.name=nordia-meeting-rooms
spring.datasource.url=jdbc:sqlite:${DB_PATH:bookings.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
# One connection: SQLite allows a single writer anyway, and it keeps transactions simple.
spring.datasource.hikari.maximum-pool-size=1
spring.jackson.property-naming-strategy=SNAKE_CASE
